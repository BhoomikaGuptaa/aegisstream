version: "3.9"

services:
  # ── Redpanda (Kafka-compatible broker) ─────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v23.3.6
    container_name: aegis-redpanda
    command:
      - redpanda start
      - --smp=1
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ── Topic initialization ────────────────────────────────────────────────────
  topic-init:
    image: redpandadata/redpanda:v23.3.6
    container_name: aegis-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        for topic in aegis.raw_events aegis.evaluated_events aegis.review_events aegis.drift_alerts aegis.deployment_checks; do
          rpk topic create $$topic --brokers redpanda:9092 --partitions 4 2>/dev/null || true
        done
        echo "Topics ready."
    restart: "no"

  # ── API Service (also runs seed/gate scripts) ───────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: aegis-api
    ports:
      - "8000:8000"
    volumes:
      - aegis-data:/data
    environment:
      DATABASE_URL: /data/aegisstream.db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Evaluator Service ───────────────────────────────────────────────────────
  evaluator:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    container_name: aegis-evaluator
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - aegis-data:/data
    environment:
      DATABASE_URL: /data/aegisstream.db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    restart: unless-stopped

  # ── Producer Service ────────────────────────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    container_name: aegis-producer
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
      DRIFT_ENABLED: ${DRIFT_ENABLED:-true}
      DRIFT_START_EVENT: ${DRIFT_START_EVENT:-500}
      INJECTION_RATE: ${INJECTION_RATE:-0.04}
      HALLUCINATION_RATE: ${HALLUCINATION_RATE:-0.08}
    restart: unless-stopped

  # ── Streamlit Dashboard ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: aegis-dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    restart: unless-stopped

volumes:
  aegis-data:
    driver: local

networks:
  default:
    name: aegisstream-net
